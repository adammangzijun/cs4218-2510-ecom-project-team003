services:
  frontend:
    build:
      context: ./client
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env.docker
    depends_on:
      - backend
  backend:
    build:
      context: .
    container_name: backend
    ports:
      - "6060:6060"
    env_file:
      - .env.docker
    depends_on:
      - db
  db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data: